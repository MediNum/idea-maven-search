name: Build Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release 需要写权限
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK (Gradle daemon)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      # 插件编译使用 Java toolchain 25（foojay 自动下载），Gradle 守护进程跑在 JDK 21
      - name: Build plugin
        run: gradle buildPlugin --no-daemon

      # 从磁盘安装要求 .jar 且 plugin.xml 在根级：取分发包内部的 instrumented 插件 jar
      - name: Package installable jar
        shell: bash
        run: |
          mkdir -p build/installable
          INNER=$(find build -name 'instrumented-*.jar' | head -1)
          echo "inner jar: $INNER"
          cp "$INNER" build/installable/maven-search-1.5.6.jar
          ls -la build/installable/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/installable/*.jar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/installable/*.jar
          generate_release_notes: true
